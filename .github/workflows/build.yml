name: Build and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: etnperlong/beeper

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Resolve Beeper stable release
        id: release
        run: |
          url=$(curl -fsSI -o /dev/null -w '%{redirect_url}' \
            https://api.beeper.com/desktop/download/linux/x64/stable/com.automattic.beeper.desktop)
          if [[ ! $url =~ ^https://beeper-desktop\.download\.beeper\.com/builds/Beeper-(4\.[0-9]+\.[0-9]+)-x86_64\.AppImage$ ]]; then
            echo "Unexpected Beeper stable download URL: $url" >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BEEPER_VERSION=${{ steps.release.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:beeper-${{ steps.release.outputs.version }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
